AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# RSpec describe blocks are long by nature.
Metrics/BlockLength:
  Exclude:
    - "**/spec/**/*.rb"

# script/prompt_pack and e2e/run.rb are tooling, not shipped code.
Metrics/AbcSize:
  Exclude:
    - "script/**/*.rb"
    - "e2e/run.rb"

Metrics/MethodLength:
  Exclude:
    - "script/**/*.rb"
    - "e2e/run.rb"

Metrics/ModuleLength:
  Exclude:
    - "script/**/*.rb"
    - "e2e/run.rb"
